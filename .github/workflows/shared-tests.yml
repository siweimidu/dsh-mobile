name: Shared tests

# 共享层（KMP shared）单元测试。shared 模块同时带 android / ios 目标，
# 配置期需要 Android SDK；测试本身跑在 JVM 上（android host test）。
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: 配置 Android SDK
        run: |
          # runner 自带 ANDROID_HOME 与 cmdline-tools，直接用，避免 setup-android
          # 去安装已被移除的 `tools` 包而失败。
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK" > local.properties

      - name: 安装编译所需 SDK 平台
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --version || \
            "$SDK/cmdline-tools/16.0/bin/sdkmanager" --version || true
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" > /dev/null 2>&1 || \
            yes | "$SDK/cmdline-tools/16.0/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" > /dev/null 2>&1 || true
          ls "$SDK/platforms" || true

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: 列出测试任务
        run: ./gradlew :shared:tasks --all --no-daemon | grep -iE "allTests|^test|HostTest" | sort -u || true

      - name: 运行共享层单测
        run: ./gradlew :shared:allTests --no-daemon --stacktrace

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-test-reports
          path: |
            shared/build/reports/tests/**
            shared/build/test-results/**
          if-no-files-found: ignore

  # 共享层同时要为 Kotlin/Native 编译；这一步在 macOS 上验证 iOS 目标能编过
  # （纯 Kotlin 逻辑，不需要 Xcode 工程，但需要 Xcode 工具链）。
  ios-framework:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 配置 Android SDK
        run: echo "sdk.dir=${ANDROID_HOME:-$HOME/Library/Android/sdk}" > local.properties

      - name: 编译 iOS 目标（Kotlin/Native）
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64 --no-daemon --stacktrace

  # Swift 侧编译校验：本地没有 Xcode，靠这里守住 Swift 语法与 shared 框架调用。
  ios-app:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 配置 Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Library/Android/sdk}}"
          echo "sdk.dir=$SDK" > local.properties

      - name: 预构建 KMP framework（模拟器）
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64 --no-daemon --stacktrace

      # Xcode 的 Build Tsnetgo XCFramework 阶段会跑 gradlew buildTsnetXcframework，
      # 它需要 gomobile，否则框架不存在会让整个构建在规划阶段就失败。
      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: 安装 gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          export PATH="$PATH:$(go env GOPATH)/bin"
          gomobile init

      - name: 构建内嵌 Tailscale 的 XCFramework
        run: ./gradlew buildTsnetXcframework --no-daemon --stacktrace

      - name: 打包未签名 IPA（设备版）
        run: |
          set -e
          xcodebuild archive \
            -project DeepSeekHarnessMobile.xcodeproj \
            -scheme DeepSeekHarnessMobile \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/DshMobile.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            -quiet
          mkdir -p build/Payload
          cp -R "build/DshMobile.xcarchive/Products/Applications/DeepSeekHarnessMobile.app" build/Payload/
          cd build && zip -qry DshMobile-unsigned.ipa Payload && ls -lh DshMobile-unsigned.ipa

      - name: 上传 IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsh-mobile-ios-unsigned-ipa
          path: build/DshMobile-unsigned.ipa
          if-no-files-found: warn
          retention-days: 30

  # Android 客户端编译校验：Windows 上无法本地构建，靠这里守住语法与依赖。
  android-app:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: 配置 Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK" > local.properties
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" > /dev/null 2>&1 || true

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-android-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-android-${{ runner.os }}-

      # androidApp 依赖内嵌 Tailscale 的本地 AAR（gomobile 编 tsnetgo），
      # 所以编译前必须准备 Go + NDK + gomobile，否则 buildTsnetAar 直接失败。
      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: 安装 Android NDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.0.12077973" > /dev/null
          echo "ANDROID_NDK_HOME=$SDK/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: 安装 gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          export PATH="$PATH:$(go env GOPATH)/bin"
          gomobile init

      - name: 编译 Android 客户端
        run: ./gradlew :androidApp:compileDebugKotlin --no-daemon --stacktrace

      - name: 打包 Debug APK
        run: ./gradlew :androidApp:assembleDebug --no-daemon --stacktrace

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: dsh-mobile-android-debug-apk
          path: androidApp/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
